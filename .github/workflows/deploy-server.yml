name: Deploy server

# After CI passes on main, ship the server to Railway (project userssdk, service
# userssdk-api). Needs a RAILWAY_TOKEN repository secret (a Railway project token);
# without it the job explains what is missing and does nothing.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Deploy to Railway
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::warning::RAILWAY_TOKEN secret is not set, so nothing was deployed."
            exit 0
          fi
          npm install -g @railway/cli
          railway up --service userssdk-api --ci
      - name: Health check
        if: env.RAILWAY_TOKEN != ''
        run: |
          for i in $(seq 1 30); do
            if curl -fsS https://userssdk-api-production.up.railway.app/actuator/health | grep -q '"UP"'; then
              echo "server is UP"; exit 0
            fi
            sleep 10
          done
          echo "::error::server did not report UP within 5 minutes"; exit 1
