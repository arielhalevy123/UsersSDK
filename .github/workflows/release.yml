name: Release

# Pushing a version tag (1.1.0, 1.2.0, …) creates a GitHub Release with notes and the
# two sample apps attached, and asks JitPack to build that version right away.
on:
  push:
    tags: ["*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the sample apps
        working-directory: UsersSdkAndroid
        run: ./gradlew --no-daemon :barberapp:assembleBarberDebug :barberapp:assembleNailsDebug
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            UsersSdkAndroid/barberapp/build/outputs/apk/barber/debug/barberapp-barber-debug.apk \
            UsersSdkAndroid/barberapp/build/outputs/apk/nails/debug/barberapp-nails-debug.apk
      - name: Warm up JitPack
        run: |
          curl -fsS -m 600 "https://jitpack.io/com/github/${GITHUB_REPOSITORY_OWNER}/UsersSDK/${GITHUB_REF_NAME}/UsersSDK-${GITHUB_REF_NAME}.pom" \
            || echo "::warning::JitPack has not finished yet; it will build on first request"
