spring.application.name=UsersSDK

# PostgreSQL. Credentials come from the environment — never commit them.
# Local development: copy .env.example to .env and export it, or set these in your run config.
# On Railway, DATABASE_URL or PGHOST/PGPORT/PGUSER/PGPASSWORD/PGDATABASE are converted to these
# properties automatically (see RailwayDatabaseEnvironmentPostProcessor).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/usersdb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT signing key. MUST be supplied via the environment in any real deployment.
# The previous hard-coded key was committed to a public repository and must be considered burned.
app.jwt.secret=${JWT_SECRET:}

server.address=0.0.0.0
# Railway (and most PaaS hosts) inject PORT; 8080 locally.
server.port=${PORT:8080}
# Trust X-Forwarded-* from the hosting proxy so generated links use https.
server.forward-headers-strategy=framework

# Health check for the host: GET /actuator/health -> {"status":"UP"}. Nothing else is exposed.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Browser origins allowed to call the API cross-origin, comma-separated. The Admin Portal is
# served by this same server, so it needs no entry. Android apps are not subject to CORS.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:3000}

# Demo accounts (admin@example.com / admin123 etc.). Turn OFF on any public deployment:
# anyone who reads the README could otherwise log in as an admin.
app.seed-demo-data=${SEED_DEMO_DATA:true}
