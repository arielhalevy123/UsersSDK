spring.application.name=UsersSDK

# PostgreSQL. Credentials come from the environment — never commit them.
# Local development: copy .env.example to .env and export it, or set these in your run config.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/usersdb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT signing key. MUST be supplied via the environment in any real deployment.
# The previous hard-coded key was committed to a public repository and must be considered burned.
app.jwt.secret=${JWT_SECRET:}

server.address=0.0.0.0
server.port=8080
