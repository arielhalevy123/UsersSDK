# In-memory database for tests. Production uses PostgreSQL (see application.properties).
spring.datasource.url=jdbc:h2:mem:usersdb_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.default_schema=
spring.jpa.show-sql=false

# Test-only signing key. Not a secret — tests must be self-contained.
app.jwt.secret=test-only-signing-key-not-used-in-any-deployment-0123456789
